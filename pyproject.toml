[project]
name = "gif-resizer"
version = "0.1.0"
description = "Scale and crop animated GIFs to an exact size using ffmpeg"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Simon Sawert", email = "simon@sawert.se" }
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "https://github.com/MatrixBox-dev/gif-resizer"
Issues = "https://github.com/MatrixBox-dev/gif-resizer/issues"

[project.scripts]
gif-resizer = "gif_resizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gif_resizer"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pillow>=12.3.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
